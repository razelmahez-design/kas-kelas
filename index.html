<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Kelas XI IPS 1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    /* Kode untuk menyembunyikan badge Netlify */
    #netlify-deploy-badge {
      display: none !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Kas Kelas XI IPS 1</h1>
        <p class="text-xs text-indigo-200">Sistem Monitoring & Catatan Kas</p>
      </div>
      <button onclick="openModal('modalSettings')" class="p-2 bg-indigo-500 rounded-lg text-white hover:bg-indigo-700">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </header>

  <!-- Container Utama -->
  <div class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Kartu Saldo -->
    <div class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-5 rounded-2xl shadow-lg">
      <p class="text-xs uppercase tracking-wider text-indigo-100">Total Saldo Kas</p>
      <h2 id="totalSaldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
      
      <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-indigo-400/30">
        <div>
          <p class="text-xs text-indigo-200">Pemasukan</p>
          <p id="totalPemasukan" class="text-lg font-semibold">Rp 0</p>
        </div>
        <div>
          <p class="text-xs text-indigo-200">Pengeluaran</p>
          <p id="totalPengeluaran" class="text-lg font-semibold">Rp 0</p>
        </div>
      </div>
    </div>

    <!-- Tombol Aksi Cepat -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="openModal('modalPemasukan')" class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-xl font-medium shadow transition">
        <i class="fas fa-plus-circle"></i> Pemasukan
      </button>
      <button onclick="openModal('modalPengeluaran')" class="flex items-center justify-center gap-2 bg-rose-600 hover:bg-rose-700 text-white py-3 px-4 rounded-xl font-medium shadow transition">
        <i class="fas fa-minus-circle"></i> Pengeluaran
      </button>
    </div>

    <!-- Tab Navigasi / Menu -->
    <div class="flex bg-slate-200 p-1 rounded-xl">
      <button onclick="switchTab('riwayat')" id="tabRiwayat" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow text-indigo-600 transition">Riwayat</button>
      <button onclick="switchTab('siswa')" id="tabSiswa" class="flex-1 py-2 text-sm font-medium rounded-lg text-slate-600 transition">Status Siswa</button>
    </div>

    <!-- Konten Tab Riwayat -->
    <div id="contentRiwayat" class="space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-700">Riwayat Transaksi</h3>
        <select id="filterTransaksi" onchange="renderRiwayat()" class="text-xs bg-white border border-slate-300 rounded-lg p-1.5">
          <option value="semua">Semua</option>
          <option value="pemasukan">Pemasukan</option>
          <option value="pengeluaran">Pengeluaran</option>
        </select>
      </div>
      <div id="listRiwayat" class="space-y-2">
        <!-- Data transaksi akan masuk sini secara otomatis -->
        <p class="text-center text-xs text-slate-400 py-6">Belum ada transaksi</p>
      </div>
    </div>

    <!-- Konten Tab Siswa -->
    <div id="contentSiswa" class="space-y-3 hidden">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-slate-700">Daftar Siswa XI IPS 1</h3>
        <button onclick="openModal('modalTambahSiswa')" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-medium shadow">
          + Tambah Nama
        </button>
      </div>
      <div id="listSiswa" class="space-y-2">
        <!-- Data siswa akan masuk sini secara otomatis -->
        <p class="text-center text-xs text-slate-400 py-6">Belum ada nama siswa. Silakan klik "+ Tambah Nama" di atas.</p>
      </div>
    </div>

  </div>

  <!-- SCRIPT / JAVASCRIPT APLIKASI -->
  <script>
    // Logika dasar aplikasi kas kelas
    let transaksi = JSON.parse(localStorage.getItem('kas_transaksi')) || [];
    let siswa = JSON.parse(localStorage.getItem('kas_siswa')) || [];

    function switchTab(tab) {
      if(tab === 'riwayat') {
        document.getElementById('contentRiwayat').classList.remove('hidden');
        document.getElementById('contentSiswa').classList.add('hidden');
        document.getElementById('tabRiwayat').className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow text-indigo-600 transition';
        document.getElementById('tabSiswa').className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-600 transition';
      } else {
        document.getElementById('contentRiwayat').classList.add('hidden');
        document.getElementById('contentSiswa').classList.remove('hidden');
        document.getElementById('tabSiswa').className = 'flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow text-indigo-600 transition';
        document.getElementById('tabRiwayat').className = 'flex-1 py-2 text-sm font-medium rounded-lg text-slate-600 transition';
        renderSiswa();
      }
    }

    function openModal(modalId) {
      // Fungsi modal bawaan aplikasi Anda
    }

    function renderRiwayat() {
      // Render riwayat transaksi
    }

    function renderSiswa() {
      // Render daftar siswa
    }
  </script>
</body>
</html>
